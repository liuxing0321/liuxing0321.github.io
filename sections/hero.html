<!-- 修改本文件即可更新对应区域；请保留原有 id 和标签结构。 -->
<style>
  /* ===== 顶部横幅：只作用于 .hero，覆盖 site.css 中的同名规则 =====
     换色只需改 --hero-bg / --hero-glow 两个值，其余不用动。 */
  #top .hero{
    --hero-bg:#9DB2BD;                       /* 底色：雾霾蓝（莫兰迪）。备选：灰绿 #9FB3A4 / 豆沙红 #C0A19E / 燕麦 #C3B8A6 */
    --hero-glow:rgba(255,255,255,.24);      /* 右上角柔光：亮底上提亮，不压暗文字 */
    padding:48px 52px 46px;
    background:
      radial-gradient(120% 140% at 88% 2%, var(--hero-glow) 0%, rgba(0,0,0,0) 62%),
      var(--hero-bg);
    color:#24343E;
    border-radius:6px;
  }
  #top .hero .eyebrow{
    font-size:11px; font-weight:500; letter-spacing:.34em; color:#2E414D;
  }
  #top .hero h1{
    margin:18px 0 4px;
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,"SimSun",serif;
    font-size:46px; font-weight:600; line-height:1.34; letter-spacing:.1em;
    color:#24343E;
    text-wrap:balance;   /* 窄屏换行时两行等长，不留“律。”这样的孤字 */
  }
  /* 英文题记：衬线斜体 + 左侧细线，作为中文标题的延伸 */
  #top .hero .hero-quote{
    margin:14px 0 0; padding:0 0 0 15px; max-width:100%; width:fit-content;
    border-left:2px solid rgba(46,65,77,.32);
  }
  #top .hero .hero-quote p{
    margin:0; max-width:46em;
    font-family:"Iowan Old Style","Baskerville","Palatino Linotype",Georgia,"Times New Roman",serif;
    font-size:15.5px; font-style:italic; line-height:1.65; letter-spacing:.005em;
    color:#2E414D; text-wrap:pretty;
  }
  #top .hero .hero-quote cite{
    display:block; margin:5px 0 0 2.6em;
    font-family:"Iowan Old Style","Baskerville","Palatino Linotype",Georgia,"Times New Roman",serif;
    font-size:12px; font-style:normal; font-variant:small-caps;
    letter-spacing:.1em; color:#344855; white-space:nowrap;
  }
  #top .hero .bar{
    width:52px; height:2px; margin:20px auto;
    background:#6E8B9B; border-radius:1px;
  }
  #top .hero p{
    max-width:52em; margin:0 auto;
    font-size:15.5px; line-height:1.95; letter-spacing:.01em;
    color:#344855;
    text-align:left;     /* 段落内部保持左对齐，整块在蓝框内居中 */
    text-wrap:balance;   /* 万一需要换行，两行长度均衡，不留孤字 */
  }

  @media (max-width:1000px){
    #top .hero{padding:40px 38px 38px;}
    #top .hero h1{font-size:38px;}
  }
  @media (max-width:740px){
    #top .hero{padding:30px 24px 28px; border-radius:5px;}
    #top .hero h1{font-size:23px; line-height:1.55; margin-top:14px; letter-spacing:.06em;}
    #top .hero .bar{margin:18px 0 16px; width:44px;}
    #top .hero p{font-size:14px; line-height:1.9;}
    #top .hero .eyebrow{letter-spacing:.26em;}
    #top .hero .hero-quote{margin-top:12px; padding-left:12px;}
    #top .hero .hero-quote p{font-size:14px; line-height:1.7;}
    #top .hero .hero-quote cite{font-size:11.5px; margin-top:5px;}
  }
</style>

<div class="hero">
  <div class="eyebrow">LANGUAGE · GRAMMAR · DIALECTS</div>
  <h1>从日常语言中，发现语法规律。</h1>
  <blockquote class="hero-quote">
    <p>It's not the language we want to understand.<br>It's the speaker</p>
    <cite>— Veda, Upanishads</cite>
  </blockquote>
  <div class="bar"></div>
  <p>关注汉语与方言的语法现象，在形式语言学与类型学视野下，探索语言的结构、意义与人群的接触融合。</p>
</div>
