<style>
  /* ===== 侧边栏：深墨蓝底 + 浅色文字 + 正文宋体 =====
     改底色只需改下面 background 的色值；文字色变量会跟着协调。 */
  [data-include="sections/profile.html"]{
    background:#16283A;
    padding:24px 20px;
    border-radius:6px;
  }

  .profile{
    --pf-accent:#D7E6F2;
    --pf-accent-soft:rgba(255,255,255,.08);
    --pf-line:rgba(255,255,255,.18);
    --pf-muted:#A9B6C0;
    /* 正文宋体：与 01 / 02 / 03 / 04 / 05 / 06 / 07 同一字体栈 */
    --pf-serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC",STSong,"SimSun",serif;
  }

  .profile .photo{
    background:var(--pf-accent-soft);
    border:1px solid var(--pf-line);
    box-shadow:0 6px 18px rgba(0,0,0,.22);
  }

  /* 姓名与单位用宋体；罗马字、职称标签仍为等宽/黑体，保住层级 */
  .profile .name{
    font-family:var(--pf-serif);
    color:var(--pf-accent);
    font-weight:600;
  }
  .profile .roman{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--pf-muted);
    letter-spacing:.26em;
  }
  .profile .role{
    color:var(--pf-accent);
    font-weight:600;
  }
  .profile .role + .role{
    color:var(--pf-muted);
    font-weight:400;
  }
  .profile .uni{
    font-family:var(--pf-serif);
    color:var(--pf-muted);
  }

  .profile .tags span{
    background:var(--pf-accent-soft);
    color:var(--pf-accent);
    border:1px solid var(--pf-line);
  }

  .profile .contact{border-top:1px solid var(--pf-line);}
  .profile .contact p{
    font-family:var(--pf-serif);
    color:var(--pf-muted);
  }

  .profile .source-link{
    color:var(--pf-accent);
    border-bottom:1px solid var(--pf-line);
  }
  .profile .source-link:hover{
    color:#FFFFFF;
    border-bottom-color:currentColor;
  }

  @media (max-width:740px){
    [data-include="sections/profile.html"]{padding:18px 16px;}
  }
</style>
